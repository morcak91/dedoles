<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matyáš Beran — Science</title>
    <style>
        :root {
            --bg: #f7f7f7;
            --panel: #ffffff;
            --border: #e0e0e0;
            --text: #2b2b2b;
            --muted: #8a8a8a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        header a img {
            display: block;
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .file-name {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .file-type {
            font-size: 0.75rem;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 8px;
            flex-shrink: 0;
        }

        .file-row a {
            color: inherit;
            text-decoration: none;
        }

        .file-row a:hover .file-name {
            text-decoration: underline;
        }

        .empty {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <a href="https://www.matyasberan.cz" title="Back to main page">
            <img src="fish-suck.gif" alt="riba">
        </a>
    </header>

    <main>
        <div class="file-list" id="fileList"></div>
    </main>

    <script>
        // Add files here. Each entry: name (with extension), size in bytes, url (path to the file).
        // Type is derived automatically from the file extension.
        const files = [
            { name: "test.txt", size: 4, url: "files/test.txt" },
        ];

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            const units = ["KB", "MB", "GB"];
            let value = bytes;
            let unitIndex = -1;
            do {
                value /= 1024;
                unitIndex++;
            } while (value >= 1024 && unitIndex < units.length - 1);
            return value.toFixed(value < 10 ? 1 : 0) + " " + units[unitIndex];
        }

        function getExtension(name) {
            const parts = name.split(".");
            return parts.length > 1 ? parts.pop().toUpperCase() : "FILE";
        }

        const listEl = document.getElementById("fileList");

        if (files.length === 0) {
            listEl.innerHTML = '<div class="empty">No files yet.</div>';
        } else {
            files.forEach(file => {
                const row = document.createElement("a");
                row.href = file.url;
                row.download = file.name;

                row.innerHTML = `
                    <div class="file-row">
                        <div class="file-info">
                            <span class="file-name">${file.name}</span>
                            <span class="file-meta">${formatSize(file.size)}</span>
                        </div>
                        <span class="file-type">${getExtension(file.name)}</span>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }
    </script>
</body>
</html>
